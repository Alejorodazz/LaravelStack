name: APP_Contenerizada 
version: '1.0.0'

# Contexto de construcción y configuración de la aplicación
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  

# Variables de entorno para el contenedor de aplicación
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost}
  DB_PASSWORD: ${DB_PASSWORD:-laravel}
  DB_DATABASE: ${DB_DATABASE:-laravel}
  DB_USERNAME: ${DB_USERNAME:-admin}
  DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
  DB_PORT: ${DB_PORT:-3306}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-db}
  FORDWARD_DB_PORT: ${FORDWARD_DB_PORT:-3308}

# Configuración de servicios de contenedores para la aplicación
x-app-services: &app-services
  build: *app-build
  restart: unless-stopped
  working_dir: /var/www/html
  env_file:
    - ../.env
  environment: *app-env
  depends_on:
    db:
      condition: service_healthy

# Configuración de redes para la aplicación
x-networks: &app-networks
  app_network:
    driver: bridge

# Configuración de healthcheck para la aplicación 
x-app-healthcheck: &app-healthcheck
  test: ["CMD", "php-fpm", "-f"]
  interval: 1m30s
  timeout: 30s
  retries: 5
  start_period: 40s

x-db-healthcheck: &db-healthcheck
  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  interval: 30s
  timeout: 10s
  retries: 5

x-webserver-healthcheck: &webserver-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8084"]
  interval: 30s
  timeout: 10s
  retries: 5
  
services:
  app:
    <<: *app-services
    container_name: app_container
    volumes: 
      - ../.:/var/www/html
    healthcheck:
      <<: *app-healthcheck
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: db_container
    restart: unless-stopped
    ports:
      - ${FORWARD_DB_PORT:-3308}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      <<: *db-healthcheck

  webserver:
    image: nginx:alpine
    container_name: webserver_container
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8084}:80"
    volumes:
      - ../.:/var/www/html
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app_network
    healthcheck:
      <<: *webserver-healthcheck 

networks:
  app_network:
    driver: bridge

volumes:
    db_data:
